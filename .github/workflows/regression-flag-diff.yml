name: Regression Flag Diff

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flag-diff:
    name: Flag on/off regression (${{ matrix.flag }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flag:
          - cognitive.enabled
          - cognitive.evolution.enabled
          - cognitive.correction.enabled
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run flag-based regression diff (${{ matrix.flag }})
        run: node scripts/regression-flag-diff.mjs src/cognitive --flag ${{ matrix.flag }}
