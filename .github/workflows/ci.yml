name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  check:
    name: Check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm plugin-sdk:check-exports
      - run: NODE_OPTIONS=--max-old-space-size=8192 pnpm plugin-sdk:api:check
      - run: node scripts/check-doc-paths.mjs
      - run: pnpm config:docs:check

  test:
    name: Test
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rm -rf node_modules/.vite node_modules/.vitest
      - run: pnpm test
