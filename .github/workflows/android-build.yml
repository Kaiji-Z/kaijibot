name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK platforms
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Download Termux APK and bundle into project
        run: |
          mkdir -p android/app/src/main/res/raw
          curl -fsSL -o android/app/src/main/res/raw/termux.apk \
            "https://github.com/Kaiji-Z/kaijibot/releases/download/v2026.6.25-1/termux-arm64.apk"
          ls -lh android/app/src/main/res/raw/termux.apk

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            kaijibot-launcher.apk

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view launcher > /dev/null 2>&1; then
            gh release create launcher --title "KaijiBot Launcher APK" --notes "Android 一键安装包（内置 Termux）。安装后打开，按提示操作即可。不需要更新此 APK — 它会自动安装最新版 KaijiBot。"
          fi
          gh release upload launcher kaijibot-launcher.apk --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaijibot-launcher
          path: kaijibot-launcher.apk
          retention-days: 90

      - name: Upload to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping"
            exit 0
          fi
          zip -j kaijibot-launcher.zip kaijibot-launcher.apk
          API="https://gitee.com/api/v5/repos/kaiji1126/kaijibot"
          REL_ID=$(curl -fsSL --max-time 30 "$API/releases?access_token=$GITEE_TOKEN" 2>/dev/null \
            | node -e "const d=require('fs').readFileSync(0,'utf8');const j=JSON.parse(d);const r=j.find(x=>x.tag_name==='launcher');console.log(r?r.id:'')" 2>/dev/null || echo "")
          if [ -z "$REL_ID" ]; then
            echo "Creating Gitee release..."
            REL_ID=$(curl -sSL --max-time 30 -X POST "$API/releases" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"launcher\",\"name\":\"KaijiBot Launcher APK\",\"body\":\"Android 一键安装包（内置 Termux）。Gitee 要求 zip 格式，下载后解压获取 APK。\",\"target_commitish\":\"main\"}" \
              | node -e "const d=require('fs').readFileSync(0,'utf8');try{console.log(JSON.parse(d).id||'')}catch(e){console.log('')}" 2>/dev/null || echo "")
            if [ -z "$REL_ID" ]; then
              echo "Failed to create Gitee release, skipping"
              exit 0
            fi
          fi
          echo "Uploading zip to Gitee release $REL_ID..."
          curl -sSL --max-time 600 -X POST "$API/releases/$REL_ID/attach_files" \
            -F "access_token=$GITEE_TOKEN" \
            -F "file=@kaijibot-launcher.zip" 2>&1 || true
          # Delete old attachment and re-upload (Gitee doesn't support --clobber)
          echo "Gitee upload done"
