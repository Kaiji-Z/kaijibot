name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK platforms
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Download Termux APK and bundle into project
        run: |
          mkdir -p android/app/src/main/res/raw
          curl -fsSL -o android/app/src/main/res/raw/termux.apk \
            "https://github.com/Kaiji-Z/kaijibot/releases/download/v2026.6.25-1/termux-arm64.apk"
          ls -lh android/app/src/main/res/raw/termux.apk

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            kaijibot-launcher.apk

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -n "$LATEST_TAG" ]; then
            gh release upload "$LATEST_TAG" kaijibot-launcher.apk --clobber
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaijibot-launcher
          path: kaijibot-launcher.apk
          retention-days: 90
