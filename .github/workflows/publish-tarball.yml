name: Publish release (npm + tarball)

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing (OIDC) needs npm >= 11.5.1. A bare "24" resolves to
      # the latest 24.x (>= 24.5.0, which bundles npm 11.5.1+). An older npm
      # silently falls back to token auth and fails with misleading ENEEDAUTH.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify npm >= 11.5.1
        run: |
          V=$(npm --version)
          N=$(echo "$V" | cut -d. -f1-2 | tr -d '.')
          [ "$N" -ge 115 ] || { echo "npm $V < 11.5.1: trusted publishing unsupported"; exit 1; }
          echo "npm $V OK"

      - name: Install pnpm
        # Pin to the packageManager version: a newer global pnpm self-switches to the
        # managed @pnpm/exe native binary, whose npm_execpath then breaks build-all's
        # pnpm runner (node executes the ELF as JS -> SyntaxError). --allow-scripts
        # because npm 11 blocks pnpm's install scripts by default.
        run: npm install -g pnpm@10.32.1 --allow-scripts=pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Same-date "-N" versions look like semver prereleases to npm 11+, which
      # refuses to publish them without an explicit dist-tag. They are real
      # releases in our scheme, so pin them to latest (matches npm 10 behavior).
      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --access public --ignore-scripts --tag latest

  upload-tarball:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: release notes are generated from the git log
          # range between the previous tag and this one.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        # Pin to the packageManager version: a newer global pnpm self-switches to the
        # managed @pnpm/exe native binary, whose npm_execpath then breaks build-all's
        # pnpm runner (node executes the ELF as JS -> SyntaxError). --allow-scripts
        # because npm 11 blocks pnpm's install scripts by default.
        run: npm install -g pnpm@10.32.1 --allow-scripts=pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create tarball
        run: npm pack --ignore-scripts

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TARBALL=$(ls kaijibot-*.tgz | head -1)
          NOTES_FILE="release-notes.md"
          # Prefer hand-written bilingual notes (EN commit log + ZH summary)
          # committed at docs/release-notes/v<version>.md.
          if [ -f "docs/release-notes/${TAG}.md" ]; then
            NOTES_FILE="docs/release-notes/${TAG}.md"
          else
            # Fallback: GitHub's --generate-notes only lists merged PRs, which
            # silently drops release.sh's direct-to-main commits. Build notes
            # from the git log range between the previous tag and this one.
            PREV_TAG=$(git describe --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
            {
              echo "## What's Changed"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                git log --no-merges --format='- %s (%h)' "${PREV_TAG}..${TAG}" | grep -v '^- chore(release)' || true
                echo ""
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
              else
                git log --no-merges -1 --format='- %s (%h)' "${TAG}"
              fi
            } > "$NOTES_FILE"
          fi
          gh release create "$TAG" "$TARBALL" --title "$TAG" --notes-file "$NOTES_FILE" || gh release upload "$TAG" "$TARBALL" --clobber
