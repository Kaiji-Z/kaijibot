<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KaijiBot Control</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#00d4aa" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        var THEMES = { "ink-jade": 1, "rice-paper": 1, glaze: 1 };
        var LEGACY = {
          claw: "ink-jade",
          knot: "rice-paper",
          dash: "glaze",
          openknot: "rice-paper",
          "openknot-light": "rice-paper",
          "dash-light": "glaze",
          dark: "ink-jade",
          light: "rice-paper",
          fieldmanual: "glaze",
          clawdash: "glaze",
          minimal: "ink-jade",
          system: "ink-jade",
        };
        try {
          var keys = Object.keys(localStorage);
          var raw;
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf("kaijibot.control.settings.v1") === 0) {
              raw = localStorage.getItem(keys[i]);
              if (raw) break;
            }
          }
          if (!raw) return;
          var s = JSON.parse(raw);
          var t = s && s.theme;
          var m = s && s.themeMode;
          if (typeof t !== "string") t = "";
          if (typeof m !== "string") m = "";
          // Resolve theme: direct match → legacy map → default
          var theme = THEMES[t] ? t : LEGACY[t] ? LEGACY[t] : "ink-jade";
          // Handle system mode
          if (m === "system") {
            var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
            if (prefersLight && theme === "ink-jade") theme = "rice-paper";
            if (!prefersLight && theme === "rice-paper") theme = "ink-jade";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute(
            "data-theme-mode",
            theme === "rice-paper" ? "light" : "dark",
          );
        } catch (e) {}
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
        });
      }
      customElements.whenDefined("kaijibot-app").then(function () {
        var el = document.getElementById("initial-loader");
        if (el) el.remove();
      });
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #06080f;
      }
      .initial-loader__spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #1c2030;
        border-top-color: #00d4aa;
        border-radius: 50%;
        animation: initial-spin 0.7s linear infinite;
      }
      @keyframes initial-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="initial-loader__spinner"></div>
    </div>
    <kaijibot-app></kaijibot-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
